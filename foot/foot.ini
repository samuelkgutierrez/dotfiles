[main]
term=foot
# sudo dnf install jetbrains-mono-fonts
font=JetBrains Mono:size=15
# font=monospace:size=14 # Backup
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

# Hide title bar.
[csd]
size=0

[colors]
foreground=a9b1d6
background=1a1b26

## Selection & Cursor customizations
selection-foreground=c0caf5
selection-background=292e42

regular0=1a1b26
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=ad8ee6
regular6=449dab
regular7=a9b1d6

bright0=414868
bright1=ff7a93
bright2=b9f27c
bright3=ff9e64
bright4=7da6ff
bright5=bb9af7
bright6=0db9d7
bright7=c0caf5

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

